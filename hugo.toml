baseURL = 'https://ctrabold.github.io/weltreisender'
title = 'Christian Trabold - Reise Blog - Weltreisender'
theme = ['hugo-book']

locale = 'de-de'
defaultContentLanguage = 'de'

copyright = '[© CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/legalcode.en)'
enableGitInfo = true

# the German and English site publish the same pre-generated images-web copies to the same paths;
# the files are identical, so Hugo's duplicate target warning (once per image) is only noise
ignoreLogs = ['warning-duplicate-target-paths']

# URLs without the `docs/` section: /2009/05/21a/, /vorbereitung/vorfahrt/ (content stays in docs/
# for the hugo-book menu); the old /docs/… URLs redirect via `aliases` (normalize_frontmatter.py)
[permalinks.page]
  docs = '/:sections[1:]/:slugorcontentbasename/'
[permalinks.section]
  docs = '/:sections[1:]/'

[[module.imports]]
  path = 'github.com/hugomods/shortcodes'

[[module.imports]]
  path = 'github.com/hugomods/images'

# @see https://book.alxs.dev/docs/content/multilingual/
[languages]
[languages.de]
label = 'Deutsch'
contentDir = 'content'
weight = 1
[languages.en]
label = 'English'
contentDir = 'content.en'
weight = 2
locale = 'en-gb'
title = 'Christian Trabold - Travel Blog - World Traveller'

[[languages.en.menus.after]]
  name = 'Map'
  pageRef = '/map'
  weight = 5
  params = { bookIcon = 'map' }

[[languages.en.menus.after]]
  name = 'Pictures'
  pageRef = '/pictures'
  weight = 7
  params = { bookIcon = 'image' }

[[languages.en.menus.after]]
  name = 'Data'
  pageRef = '/data'
  weight = 9
  params = { bookIcon = 'bar-chart' }

[[languages.en.menus.after]]
  name = 'Tags'
  pageRef = '/tags'
  weight = 10
  params = { bookIcon = 'tag' }

[[languages.en.menus.after]]
  name = 'Website'
  url = 'https://christian-trabold.de/'
  weight = 40
  params = { bookIcon = 'outgoing' }

[params]
  BookTheme = 'auto'
  BookComments = false
  BookSearch = false
  # BookLastChangeLink = 'https://github.com/ctrabold/weltreisender/commit/{{ .GitInfo.Hash }}'
  # BookEditLink = 'https://github.com/ctrabold/weltreisender/edit/main/{{ .Path }}'
  # trip whose numbers the homepage profile and the data page show (key of params.trips)
  defaultTrip = 'singapore'

# Trips ("books"): diary posts are grouped by month, from/to inclusive ('YYYY-MM').
# Day counter, km so far, route legs (scripts/build_routes.py) and charts never cross a trip.
[[params.trips]]
  key = 'budapest'
  from = '2007-09'
  to = '2007-09'
[[params.trips]]
  key = 'singapore'
  from = '2009-04'
  to = '2010-05'

[params.hugomods]
    [params.hugomods.images]
      modern_format = 'webp'

[markup]
[markup.goldmark.renderer]
  unsafe = true
[markup.tableOfContents]
  startLevel = 3

[menu]
[[menu.after]]
  name = 'Karte'
  pageRef = '/karte'
  weight = 5
  params = { bookIcon = 'map' }

[[menu.after]]
  name = 'Bilder'
  pageRef = '/bilder'
  weight = 7
  params = { bookIcon = 'image' }

[[menu.after]]
  name = 'Daten'
  pageRef = '/daten'
  weight = 9
  params = { bookIcon = 'bar-chart' }

[[menu.after]]
  name = 'Tags'
  pageRef = '/tags'
  weight = 10
  params = { bookIcon = 'tag' }

[[menu.after]]
  name = 'Website'
  url = 'https://christian-trabold.de/'
  weight = 40
  params = { bookIcon = 'outgoing' }
