timeout = 20
retry_wait_time = 1
max_retries = 0
max_redirects = 10
max_concurrency = 2
#accept = [429, 200]
require_https = false

# Be polite: one request per host at a time, at most one per second (adaptive, slows down on 429),
# and reuse results for a week (.lycheecache, gitignored), so repeated runs don't hit the sites again.
# @see https://lychee.cli.rs/troubleshooting/rate-limits/
host_concurrency = 1
host_request_interval = "1s"
cache = true
max_cache_age = "7d"
cache_exclude_status = "429, 500.."

exclude = [
    '^https?://([^/]*\.)?(google\.[a-z.]+|goo\.gl)/', # Google (maps, search) blocks bots and then the whole IP
    '^https?://example\.com',                         # match both HTTP and HTTPS
    '^https://(www\.)?linkedin\.com',                 # No linkendin
    '^https://(.*\.)?github(usercontent)?\.(com|io)', # exclude common GitHub URLs
]

# Root-relative post images (/images/<y>/<m>/<d>/<name>.jpg) name the original; the site serves
# the web copy assets/images/<same path>.webp (layouts/_markup/render-image.html).
root_dir = "assets"
remap = ['^(file://.*/assets/images/.*)\.jpe?g$ $1.webp']
