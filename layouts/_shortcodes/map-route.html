{{ $id := delimit (shuffle (seq 1 9)) "" }}
{{ $startLat := .Get "startLat" }}
{{ $startLon := .Get "startLon" }}
{{ $endLat   := .Get "endLat" }}
{{ $endLon   := .Get "endLon" }}
{{/* mode can be: "foot", "bike", or "car" (defaults to "foot") */}}
{{ $mode     := .Get "mode" | default "foot" }}

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<div id="map-{{ $id }}" style="height: 380px; width: 100%; border-radius: 8px; margin: 1.5rem 0;"></div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const start = [{{ $startLat }}, {{ $startLon }}];
  const end = [{{ $endLat }}, {{ $endLon }}];
  const mode = "{{ $mode }}"; // "foot", "bike", or "car"

  const map = L.map('map-{{ $id }}');

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  L.marker(start).addTo(map).bindPopup("Start");
  L.marker(end).addTo(map).bindPopup("Destination");

  // Call the public OSRM routing API (Note: OSRM expects {longitude},{latitude})
  const url = `https://router.project-osrm.org/route/v1/${mode}/${start[1]},${start[0]};${end[1]},${end[0]}?overview=full&geometries=geojson`;

  fetch(url)
    .then(res => res.json())
    .then(data => {
      if (data.routes && data.routes.length > 0) {
        // GeoJSON coordinates come in [lon, lat], Leaflet expects [lat, lon]
        const coordinates = data.routes[0].geometry.coordinates.map(coord => [coord[1], coord[0]]);

        const routeColor = mode === 'bike' ? '#00aa55' : '#e65100';
        const polyline = L.polyline(coordinates, { color: routeColor, weight: 5, opacity: 0.8 }).addTo(map);

        map.fitBounds(polyline.getBounds(), { padding: [35, 35] });
      } else {
        // Fallback straight line if no route found
        const fallback = L.polyline([start, end], { color: '#999', dashArray: '5, 10' }).addTo(map);
        map.fitBounds(fallback.getBounds(), { padding: [35, 35] });
      }
    })
    .catch(() => {
      const fallback = L.polyline([start, end], { color: '#999', dashArray: '5, 10' }).addTo(map);
      map.fitBounds(fallback.getBounds(), { padding: [35, 35] });
    });
});
</script>
